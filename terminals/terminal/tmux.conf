%if "#{==:#{m:*@kiwi*,#{window-status-format}},0}"
set -ga window-status-format "#{?@kiwi, #{@kiwi},}"
%endif
%if "#{==:#{m:*@kiwi*,#{window-status-current-format}},0}"
set -ga window-status-current-format "#{?@kiwi, #{@kiwi},}"
%endif
bind-key -T prefix K if-shell -F "#{S:#{W:#{?@kiwi,1,}}}" "choose-tree -Zw -f '#{@kiwi}'" "display-message 'No agent needs you now'"
